[versions]
agp = "8.11.1"
androidActivation = "1.6.7"
androidMail = "1.6.7"
appcompat = "1.6.1"
fragment = "1.5.7"
httpcore = "4.4.15"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2024.09.00"
smackAndroid = "4.4.8"
smackExtensions = "4.4.8"
smackIm = "4.4.8"
smackTcp = "4.4.8"
viewpager = "1.0.0"

[libraries]
android-mail = { module = "com.sun.mail:android-mail", version.ref = "androidMail" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

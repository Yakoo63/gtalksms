androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
mail-android-activation = { module = "com.sun.mail:android-activation", version.ref = "androidActivation" }
smack-android = { module = "org.igniterealtime.smack:smack-android", version.ref = "smackAndroid" }
smack-extensions = { module = "org.igniterealtime.smack:smack-extensions", version.ref = "smackExtensions" }
smack-im = { module = "org.igniterealtime.smack:smack-im", version.ref = "smackIm" }
smack-tcp = { module = "org.igniterealtime.smack:smack-tcp", version.ref = "smackTcp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

